[project]
name = "bot-defense-auditor"
version = "1.0.0"
description = "Test your WAF/bot detection rules against known signatures"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abdul", email = "abdul@example.com"}]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.26.0",
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
bot-audit = "bot_auditor.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "UP", "W"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]